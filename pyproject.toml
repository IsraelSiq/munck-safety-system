[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "munck-safety-system"
version = "0.2.0"
description = "Sistema auxiliar de sinalizacao de seguranca para operacoes com guindaste (Munck)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "opencv-python-headless>=4.9",
  "ultralytics>=8.3,<9",
  "numpy>=1.26",
  "shapely>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "structlog>=24.1",
  "psutil>=5.9",
  "pygame>=2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "ruff>=0.4",
]

[project.scripts]
munck-safety = "munck_safety.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
addopts = "-v --tb=short"
