[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "munck-safety-system"
version = "0.1.0"
description = "Munck Safety POC for person-in-zone detection"
requires-python = ">=3.10"
dependencies = [
  "opencv-python>=4.8,<5",
  "ultralytics>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
